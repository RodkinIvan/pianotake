name: Desktop apps

# Builds the pianotake app for macOS (Apple Silicon and Intel), Windows and Linux, runs a
# smoke test of each build, and uploads them as workflow artifacts.
#   * Push a tag like v0.2.0 to also publish a GitHub Release with all builds attached.
#   * Or run it by hand (Actions > Desktop apps > Run workflow); fill in "release_tag" to
#     attach the builds to an existing release.
#
# macOS signing and notarization switch on when these repository secrets exist:
#   MACOS_CERT_P12           base64 of your "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD      password of that .p12
#   MACOS_SIGN_ID            e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8            contents of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID            that key's ID
#   NOTARY_ISSUER            the issuer ID shown with the key
# Without them the macOS app is ad-hoc signed. Windows and Linux builds are unsigned.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release (e.g. v0.1.0); leave empty to only build"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-22.04 }   # older glibc = runs on more distros
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libasound2-dev

      - run: pip install pyinstaller .

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "PIANOTAKE_SIGN_ID=$MACOS_SIGN_ID" >> "$GITHUB_ENV"

      - name: Notary API key
        if: runner.os == 'macOS' && env.NOTARY_KEY_P8 != ''
        run: |
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: PYTHON=python packaging/macos/build.sh

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: python packaging/build.py

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   BIN=dist/pianotake.app/Contents/MacOS/pianotake ;;
            Windows) BIN=dist/pianotake/pianotake.exe ;;
            Linux)   BIN=dist/pianotake/pianotake ;;
          esac
          "$BIN" --self-test
          "$BIN" --version
          file "$BIN" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: pianotake-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -la assets
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --title "pianotake $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
